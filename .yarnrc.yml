enableColors: true

nmHoistingLimits: workspaces

nodeLinker: node-modules

plugins:
  - path: .yarn/plugins/@yarnpkg/plugin-typescript.cjs
    spec: "@yarnpkg/plugin-typescript"

npmScopes:
  yuga-labs:
    npmRegistryServer: "https://npm.pkg.github.com"

npmRegistries:
  "//npm.pkg.github.com":
    npmAlwaysAuth: true
    npmAuthToken: ${GITHUB_TOKEN}

packageExtensions:
  "*":
    packageManager: null
